<title id="pmv-notes-to-modes-title">From notes to failure modes</title>
<desc id="pmv-notes-to-modes-desc">Ten review notes sorted into three failure modes, one success mode, and a Not a product problem pile, then ranked by how often and how badly each hurts. Ignoring requests for a person ranks first even though stray symbols in texts is more common.</desc>
