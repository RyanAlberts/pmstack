<text x="32" y="68" font-size="40" font-weight="700" style="fill:#E9EBEE"><tspan x="32">Error discovery,</tspan><tspan x="32" dy="46">step by step</tspan></text>
<text x="32" y="148" font-size="22" style="fill:#A9B1BB"><tspan x="32">Your judgment sets the bar.</tspan><tspan x="32" dy="28">AI helps you go faster.</tspan></text>
