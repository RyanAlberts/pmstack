<path d="M632 320L860 320" style="fill:none;stroke:#E2DFD8" stroke-width="1.2" stroke-linecap="round"/>
<text x="632" y="346" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" style="fill:#16191D">status:</text>
<text x="632" y="370" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" style="fill:#16191D">pending_approval</text>
<path d="M881 344L900 344" style="fill:none;stroke:#646B73" stroke-width="1.8" stroke-linecap="round"/>
<path d="M904 344L895 349L895 339.1Z" style="fill:#646B73"/>
<rect x="908" y="280" width="260" height="128" rx="12" style="fill:#F0EEE8;stroke:#E2DFD8" stroke-width="1.2"/>
<text x="924" y="308" font-size="18" font-weight="600" style="fill:#4A525C">Agent replies</text>
