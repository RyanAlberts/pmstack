<rect x="334" y="376" width="120" height="25" rx="5" style="fill:#FBE7E2"/>
<path d="M336 400L452 400" style="fill:none;stroke:#BE3E29" stroke-width="2" stroke-linecap="round"/>
<text x="340" y="346" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" style="fill:#16191D">issue_credit</text>
<text x="340" y="370" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" style="fill:#16191D">account_id: A-1182</text>
<text x="340" y="394" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" style="fill:#16191D">amount: 80</text>
<path d="M589 344L608 344" style="fill:none;stroke:#646B73" stroke-width="1.8" stroke-linecap="round"/>
<path d="M612 344L603 349L603 339.1Z" style="fill:#646B73"/>
<rect x="616" y="280" width="260" height="128" rx="12" style="fill:#F0EEE8;stroke:#E2DFD8" stroke-width="1.2"/>
