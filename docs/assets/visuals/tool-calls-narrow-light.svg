<rect x="919" y="328" width="61" height="25" rx="5" style="fill:#FBE7E2"/>
<path d="M921 352L978 352" style="fill:none;stroke:#BE3E29" stroke-width="2" stroke-linecap="round"/>
<text x="924" y="346" font-size="18" style="fill:#16191D"><tspan x="924"><tspan font-weight="600">Done!</tspan> $80 is off your</tspan><tspan x="924" dy="24">next bill.</tspan></text>
<text x="454" y="150" font-size="20" font-weight="700" text-anchor="middle" style="fill:#16191D">Policy</text>
<text x="454" y="178" font-size="18" text-anchor="middle" style="fill:#4A525C">Allowed? Verified? Confirmed? Under the limit?</text>
<rect x="327.7" y="192" width="252.6" height="34" rx="17" style="fill:#F0EEE8;stroke:#646B73;stroke-opacity:0.55" stroke-width="1.2"/>
<text x="454" y="215.3" font-size="18" font-weight="600" text-anchor="middle" style="fill:#16191D">Code check: policy rules</text>
<path d="M321.4 232h10v13a5 5 0 0 1 -10 0Z" style="fill:#BE3E29"/>
<text x="341.4" y="247" font-size="18" font-weight="600" style="fill:#BE3E29">Over $50 needs a supervisor</text>
<path d="M334 272V264H574V272M454 264V256" style="fill:none;stroke:#646B73" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M42 416V424H574V416M308 424V432" style="fill:none;stroke:#646B73" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="308" y="464" font-size="20" font-weight="700" text-anchor="middle" style="fill:#16191D">Relevance</text>
<text x="308" y="492" font-size="18" text-anchor="middle" style="fill:#4A525C">Right tool, right details for what they asked?</text>
<rect x="132.3" y="506" width="351.3" height="34" rx="17" style="fill:#F0EEE8;stroke:#646B73;stroke-opacity:0.55" stroke-width="1.2"/>
<text x="308" y="529.3" font-size="18" font-weight="600" text-anchor="middle" style="fill:#16191D">Code check: intent map, or AI judge</text>
<path d="M626 416V424H1158V416M892 424V432" style="fill:none;stroke:#646B73" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="892" y="464" font-size="20" font-weight="700" text-anchor="middle" style="fill:#16191D">Output grounding</text>
<text x="892" y="492" font-size="18" text-anchor="middle" style="fill:#4A525C">Does the reply match what the tool returned?</text>
<rect x="724.1" y="506" width="335.8" height="34" rx="17" style="fill:#F0EEE8;stroke:#646B73;stroke-opacity:0.55" stroke-width="1.2"/>
<text x="892" y="529.3" font-size="18" font-weight="600" text-anchor="middle" style="fill:#16191D">Code check: values, then AI judge</text>
<path d="M779 549h10v13a5 5 0 0 1 -10 0Z" style="fill:#BE3E29"/>
<text x="799" y="564" font-size="18" font-weight="600" style="fill:#BE3E29">Pending shown as done</text>
<text x="32" y="600" font-size="18" style="fill:#4A525C">Policy rules come from your company. Relevance and grounding problems show up when you read traces.</text>
</g>
</svg>
