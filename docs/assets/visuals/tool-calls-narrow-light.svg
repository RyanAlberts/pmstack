<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 746" width="1200" height="746" role="img" aria-labelledby="pmv-tool-calls-narrow-title pmv-tool-calls-narrow-desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif">
<title id="pmv-tool-calls-narrow-title">Three questions for every tool call</title>
<desc id="pmv-tool-calls-narrow-desc">Three questions for every tool call, shown on one example. The customer asks: The outage took us down for two days. Can I get a credit? The agent calls the tool issue_credit with account_id A-1182 and amount 80. The tool returns status pending_approval. The agent replies: Done! $80 is off your next bill. Policy sits on the call: allowed, verified, confirmed, under the limit? Here it fails, because a credit over $50 needs a supervisor. It is checked with a code check of policy rules. Relevance spans the request and the call: right tool, right details for what they asked? It is checked with a code check that uses an intent map, or with an AI judge. Output grounding spans the tool result and the reply: does the reply match what the tool returned? Here it fails, because a pending credit is shown as done. It is checked with a code check of the values, then an AI judge. Policy rules come from your company. Relevance and grounding problems show up when you read traces.</desc>
<rect x="0.5" y="0.5" width="1199" height="745" rx="20" style="fill:#FFFFFF;stroke:#E2DFD8" stroke-width="1"/>
<text x="32" y="68" font-size="40" font-weight="700" style="fill:#16191D"><tspan x="32">Three questions</tspan><tspan x="32" dy="46">for every tool call</tspan></text>
<text x="32" y="148" font-size="22" style="fill:#4A525C"><tspan x="32">Policy, relevance, and output grounding</tspan><tspan x="32" dy="28">checks for agents that use tools.</tspan></text>
<path d="M32 201h10v13a5 5 0 0 1 -10 0Z" style="fill:#BE3E29"/>
<text x="52" y="216" font-size="18" style="fill:#4A525C">Failure mode</text>
<rect x="191.2" y="202" width="30" height="16" rx="8" style="fill:#F0EEE8;stroke:#646B73" stroke-width="1.3"/>
<text x="231.2" y="216" font-size="18" style="fill:#4A525C">Check</text>
<g transform="translate(0 126)">
<rect x="32" y="280" width="260" height="128" rx="12" style="fill:#F0EEE8;stroke:#E2DFD8" stroke-width="1.2"/>
<text x="48" y="308" font-size="18" font-weight="600" style="fill:#4A525C">Customer asks</text>
<path d="M48 320L276 320" style="fill:none;stroke:#E2DFD8" stroke-width="1.2" stroke-linecap="round"/>
<text x="48" y="346" font-size="18" style="fill:#16191D"><tspan x="48">The outage took us down</tspan><tspan x="48" dy="24">for two days. Can I get a</tspan><tspan x="48" dy="24">credit?</tspan></text>
<path d="M297 344L316 344" style="fill:none;stroke:#646B73" stroke-width="1.8" stroke-linecap="round"/>
<path d="M320 344L311 349L311 339.1Z" style="fill:#646B73"/>
