<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 846" width="1200" height="846" role="img" aria-labelledby="pmv-funnel-narrow-title pmv-funnel-narrow-desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif">
<title id="pmv-funnel-narrow-title">The funnel of an AI experience</title>
<desc id="pmv-funnel-narrow-desc">The funnel of an AI experience for a dental booking assistant. 100 reviewed conversations move left to right through five stages: understand the request, hand off when needed, check the calendar, book or change, reply to the patient. At each stage, failing conversations drop out under a named failure mode, such as 7 that ignored requests for a person, and green chips show success modes, such as repeating the booking back. A bottom row shows the check for each failure mode, where one exists. 64 of 100 reach a good outcome.</desc>
<rect x="0.5" y="0.5" width="1199" height="845" rx="20" style="fill:var(--surface, #FFFFFF);stroke:var(--line, #E2DFD8)" stroke-width="1"/>
<text x="32" y="68" font-size="40" font-weight="700" style="fill:var(--ink, #16191D)"><tspan x="32">The funnel of an</tspan><tspan x="32" dy="46">AI experience</tspan></text>
<text x="32" y="148" font-size="22" style="fill:var(--ink-2, #4A525C)"><tspan x="32">Example: 100 reviewed conversations</tspan><tspan x="32" dy="28">with a dental booking assistant</tspan></text>
