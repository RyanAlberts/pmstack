<text x="866" y="446" font-size="18" style="fill:#16191D"><tspan x="866">The judge misses some failures and</tspan><tspan x="866" dy="24">flags some good ones. Correcting</tspan><tspan x="866" dy="24">for both gives the likely true rate.</tspan></text>
<text x="40" y="558" font-size="18" style="fill:#4A525C">A judge that always says Good would score 100% on the second question and 0% on the first. You need both numbers.</text>
