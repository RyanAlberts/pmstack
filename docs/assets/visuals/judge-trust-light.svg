<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="pmv-judge-trust-title pmv-judge-trust-desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif">
<title id="pmv-judge-trust-title">Can you trust your AI judge?</title>
<desc id="pmv-judge-trust-desc">Can you trust your AI judge? The judge for Ignores requests for a person was measured on 75 labeled conversations kept aside until the end. It caught 23 of 25 real failures (92%) and agreed on 47 of 50 good conversations (94%). On 400 new conversations it flagged 18%. Correcting for its known mistakes, the likely true failure rate is 14%, with a 95% range of 4% to 21%.</desc>
<rect x="0.5" y="0.5" width="1199" height="599" rx="20" style="fill:#FFFFFF;stroke:#E2DFD8" stroke-width="1"/>
<text x="32" y="68" font-size="40" font-weight="700" style="fill:#16191D">Can you trust your AI judge?</text>
<text x="32" y="102" font-size="22" style="fill:#4A525C">Compare it with your own labels. Ask two questions.</text>
<rect x="1077" y="46" width="30" height="16" rx="8" style="fill:#F0EEE8;stroke:#646B73" stroke-width="1.3"/>
<text x="1117" y="60" font-size="18" style="fill:#4A525C">Check</text>
<circle cx="938.9" cy="49.4" r="3.8" style="fill:#3A56D4"/>
<path d="M931.9 62a7 6.6 0 0 1 14 0z" style="fill:#3A56D4"/>
<text x="956.9" y="60" font-size="18" style="fill:#4A525C">You decide</text>
<rect x="32" y="124" width="30" height="16" rx="8" style="fill:#F0EEE8;stroke:#646B73" stroke-width="1.3"/>
<text x="72" y="138" font-size="18" style="fill:#4A525C">Judge: Ignores requests for a person. Measured on 75 labeled conversations kept aside until the end.</text>
<text x="40" y="190" font-size="20" font-weight="700" style="fill:#16191D">Does it catch real failures?</text>
