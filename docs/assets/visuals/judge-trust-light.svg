<text x="234.1" y="290" font-size="18" style="fill:#4A525C">Judge missed it</text>
<text x="640" y="240" font-size="48" font-weight="700" style="fill:#16191D">92%</text>
<text x="640" y="270" font-size="18" style="fill:#4A525C">Catches real failures</text>
<text x="640" y="294" font-size="18" style="fill:#646B73">23 of 25</text>
<text x="40" y="350" font-size="20" font-weight="700" style="fill:#16191D">Does it leave good traces alone?</text>
