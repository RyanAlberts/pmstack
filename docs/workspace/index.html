<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening Eval Studio</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta http-equiv="refresh" content="0; url=../studio/">
<link rel="canonical" href="https://ryanalberts.github.io/pmstack/studio/">
<link rel="icon" href="../studio/icon.svg" type="image/svg+xml">
<script>location.replace('../studio/');</script>
<style>
:root { color-scheme: light; --bg: #F7F6F2; --ink: #16191D; --ink-2: #4A525C; --accent: #3A56D4; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --bg: #0F1216; --ink: #E9EBEE; --ink-2: #A9B1BB; --accent: #8AA2FF; }
}
:root[data-theme="dark"] { color-scheme: dark; --bg: #0F1216; --ink: #E9EBEE; --ink-2: #A9B1BB; --accent: #8AA2FF; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
  background: var(--bg); color: var(--ink-2);
  font: 400 16px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center;
}
h1 { margin: 0 0 8px; color: var(--ink); font-size: 20px; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); font-weight: 600; text-underline-offset: 3px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <h1>Eval Studio has a new address</h1>
  <p>Taking you there now. If nothing happens, <a href="../studio/">open Eval Studio</a>.</p>
</main>
</body>
</html>
