name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Engine, command line, and repo tests
        run: node --test
      - name: Visuals match the samples
        run: node scripts/build-visuals.mjs --check
      - name: Samples are consistent
        run: node scripts/check-samples.mjs --check
